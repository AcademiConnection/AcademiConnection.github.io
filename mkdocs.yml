site_name: Academic Connection Network
site_description: 学术关系网络资料库
site_url: https://academiconnection.github.io/
repo_name: AcademiConnection/AcademiConnection.github.io
repo_url: https://github.com/AcademiConnection/AcademiConnection.github.io
edit_uri: ''
theme:
  name: material
  language: zh
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      toggle:
        icon: material/weather-night
        name: 切换至夜间模式
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 切换至日间模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
  logo: assets/icon-transparent-128x128.png
  favicon: assets/icon-transparent-32x32.png

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

